version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: car-obstacle-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: car_obstacle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - car-obstacle-network

  app:
    build: .
    container_name: car-obstacle-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/car_obstacle
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - car-obstacle-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  car-obstacle-network:
    driver: bridge
